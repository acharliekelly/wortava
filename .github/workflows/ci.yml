name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        if: runner.os != 'Windows'
        run: uv sync --extra dev
      - name: Install dependencies with Windows adapters
        if: runner.os == 'Windows'
        run: uv sync --extra dev --extra windows
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=wortava --cov-branch --cov-report=term-missing --cov-fail-under=90 -q

  windows-package:
    name: Windows package
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra windows
      - name: Build onedir package
        run: uv run pyinstaller wortava.spec --clean
      - name: Smoke-test packaged executable
        run: uv run pytest tests/acceptance/test_packaged_cli.py --run-windows-package -q
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/wortava/wortava.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  wortava/wortava.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: wortava-windows-x64
          path: |
            dist/wortava/
            dist/SHA256SUMS.txt
          if-no-files-found: error
